<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron Job 테스트</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f8fafc;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0f172a;
            margin-bottom: 24px;
        }
        button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #e11d48;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .success {
            background: #dcfce7;
            border: 2px solid #22c55e;
            color: #166534;
        }
        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        .loading {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            color: #1e40af;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 인플루언서 칼럼 자동 생성 테스트</h1>
        <p style="color: #64748b; margin-bottom: 24px;">
            아래 버튼을 클릭하면 Google Gemini로 칼럼을 생성하고 Supabase에 저장합니다.
        </p>
        
        <button id="testBtn" onclick="testCronJob()">
            칼럼 생성 시작
        </button>

        <div id="result"></div>
    </div>

    <script>
        async function testCronJob() {
            const btn = document.getElementById('testBtn');
            const resultDiv = document.getElementById('result');
            
            // 버튼 비활성화
            btn.disabled = true;
            btn.innerHTML = '생성 중<span class="spinner"></span>';
            
            // 로딩 상태
            resultDiv.className = 'loading';
            resultDiv.textContent = '⏳ AI 칼럼 생성 중... (30~60초 소요)\n\n1. Google Gemini로 칼럼 작성 중...\n2. Imagen으로 썸네일 생성 중...\n3. Supabase에 저장 중...';

            try {
                const startTime = Date.now();
                
                const response = await fetch('http://localhost:3000/api/cron/generate-column', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer daonview-cron-secret-2026-secure-key'
                    }
                });

                const data = await response.json();
                const duration = ((Date.now() - startTime) / 1000).toFixed(2);

                if (response.ok && data.success) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = `✅ 칼럼 생성 성공! (${duration}초 소요)\n\n` +
                        `📌 Post ID: ${data.post.id}\n` +
                        `📝 제목: ${data.post.title}\n` +
                        `🎨 썸네일: ${data.thumbnail_generated ? '생성 완료' : '생성 실패 (기본 이미지 사용)'}\n` +
                        `📅 생성 시간: ${new Date(data.post.created_at).toLocaleString('ko-KR')}\n\n` +
                        `👉 커뮤니티 > 인플루언서 칼럼에서 확인하세요!`;
                } else {
                    throw new Error(data.error || '알 수 없는 오류');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ 오류 발생\n\n${error.message}\n\n` +
                    `💡 해결 방법:\n` +
                    `1. npm run dev가 실행 중인지 확인\n` +
                    `2. .env.local에 GOOGLE_AI_API_KEY가 설정되었는지 확인\n` +
                    `3. 콘솔 로그 확인 (F12)`;
            } finally {
                // 버튼 활성화
                btn.disabled = false;
                btn.innerHTML = '칼럼 생성 시작';
            }
        }
    </script>
</body>
</html>
